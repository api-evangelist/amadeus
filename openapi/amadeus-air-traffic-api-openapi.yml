openapi: 3.2.0
info:
  title: Amadeus Air Traffic API
  x-refined-note:
  - x-release-note differs across the merged source definitions and was not carried
  x-status: validated
  x-tags:
  - '#ama-for-dev'
  version: '1.0'
  description: 'Operations tagged air-traffic across 3 of this provider''s published API definitions: amadeus-flight-busiest-traveling-period-openapi.yml, amadeus-flight-most-booked-destinations-openapi.yml, amadeus-flight-most-traveled-destinations-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://test.api.amadeus.com/v1
tags:
- name: air-traffic
paths:
  /travel/analytics/air-traffic/busiest-period:
    get:
      tags:
      - air-traffic
      operationId: getAirTraffic
      summary: Amadeus Returns a List of Air Traffic Reports
      parameters:
      - name: cityCode
        description: Code for the city following IATA standard. [IATA table codes](http://www.iata.org/publications/Pages/code-search.aspx) - e.g. BOS for Boston
        in: query
        required: true
        x-example: MAD
        schema:
          type: string
          pattern: '[A-Za-z]{3}'
      - name: period
        description: 'time period (year) of the statistics.


          Year for which the statistic are requested following [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)

          '
        in: query
        required: true
        x-example: 2017
        schema:
          type: string
      - name: direction
        description: 'Use ARRIVING to have statistics on travelers coming to the city or DEPARTING for statistics on travelers leaving the city.


          By default, statistics are given on travelers ARRIVING the city.

          '
        in: query
        required: false
        x-example: ARRIVING
        schema:
          type: string
          enum:
          - ARRIVING
          - DEPARTING
          default: ARRIVING
      responses:
        '200':
          $ref: '#/components/responses/air-traffic'
        '400':
          $ref: '#/components/responses/400'
        default:
          $ref: '#/components/responses/500'
      description: ''
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: https://test.api.amadeus.com/v1
  /travel/analytics/air-traffic/booked:
    get:
      tags:
      - air-traffic
      operationId: getAirTraffic
      summary: Amadeus Returns a List of Air Traffic Reports
      parameters:
      - name: originCityCode
        description: Code for the origin city following IATA standard ([IATA table codes](http://www.iata.org/publications/Pages/code-search.aspx)). - e.g. BOS for Boston
        in: query
        required: true
        x-example: MAD
        schema:
          type: string
          pattern: '[A-Za-z]{3}'
      - name: period
        description: "period when consumers are traveling.\n* It can be a month only. \n* ISO format must be used - e.g. 2015-05. \n* Period ranges are not supported. \n* Only periods from 2011-01 up to previous month are valid. \n* Future dates are not supported.\n"
        in: query
        required: true
        x-example: 2017-08
        schema:
          type: string
      - name: max
        description: maximum number of destinations in the response. Default value is 10 and maximum value is 50.
        in: query
        required: false
        x-example: 1.0
        schema:
          type: number
          format: integer
          default: 10
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/pageLimit'
      - $ref: '#/components/parameters/pageOffset'
      - $ref: '#/components/parameters/sort'
      responses:
        '200':
          $ref: '#/components/responses/air-traffic_2'
        '400':
          $ref: '#/components/responses/400_2'
        default:
          $ref: '#/components/responses/500'
      description: ''
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: https://test.api.amadeus.com/v1
  /travel/analytics/air-traffic/traveled:
    get:
      tags:
      - air-traffic
      operationId: getAirTraffic
      summary: Amadeus Returns a List of Air Traffic Reports
      parameters:
      - name: originCityCode
        description: Code for the origin city following IATA standard ([IATA table codes](http://www.iata.org/publications/Pages/code-search.aspx)). - e.g. BOS for Boston
        in: query
        required: true
        x-example: MAD
        schema:
          type: string
          pattern: '[A-Za-z]{3}'
      - name: period
        description: "period when consumers are traveling.\n* It can be a month only. \n* [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format must be used - e.g. 2015-05. \n* Period ranges are not supported. \n* Only periods from 2011-01 up to previous month are valid. \n* Future dates are not supported.\n"
        in: query
        required: true
        x-example: 2017-01
        schema:
          type: string
      - name: max
        description: maximum number of destinations in the response. Default value is **10** and maximum value is 50.
        in: query
        required: false
        x-example: 1.0
        schema:
          type: number
          format: integer
          default: 10
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/pageLimit'
      - $ref: '#/components/parameters/pageOffset'
      - $ref: '#/components/parameters/sort_2'
      responses:
        '200':
          $ref: '#/components/responses/air-traffic_3'
        '400':
          $ref: '#/components/responses/400_3'
        default:
          $ref: '#/components/responses/500'
      description: ''
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: https://test.api.amadeus.com/v1
components:
  schemas:
