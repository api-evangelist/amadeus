openapi: 3.2.0
info:
  version: 2.0.2
  title: On-Demand Flight Status Flights API
  x-status: validated
  x-release-note:
    '2.0':
    - Initial version
  description: 'Before using this API, we recommend you read our **Authorization Guide** for more information on how to generate an access token.


    Please also be aware that our test environment is based on a subset of the production, to see what is included in test please refer to our **data collection**.'
servers:
- url: https://test.api.amadeus.com/v2
tags:
- name: Flights
paths:
  /schedule/flights:
    get:
      tags:
      - Flights
      operationId: getFlightsStatus
      summary: Amadeus Retrieves a Unique Flight by Search Criteria
      parameters:
      - name: carrierCode
        in: query
        description: '2 to 3-character IATA carrier code ([IATA table codes](http://www.iata.org/publications/Pages/code-search.aspx)).

          '
        required: true
        x-example: TP
        schema:
          type: string
      - name: flightNumber
        in: query
        description: 1 to 4-digit number of the flight. e.g. 4537
        required: true
        x-example: '487'
        schema:
          type: string
      - name: scheduledDepartureDate
        in: query
        description: scheduled departure date of the flight, local to the departure airport, format YYYY-MM-DD.
        x-example: '2023-08-01'
        required: true
        schema:
          type: string
          format: date
      - name: operationalSuffix
        in: query
        description: '1-letter operational suffix assigned by the carrier to differentiate flight in case of delay changing the departure date e.g. A

          '
        x-example: string-value
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/datedFlights'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        default:
          $ref: '#/components/responses/500'
      description: ''
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    Timing:
      properties:
        qualifier:
          description: the qualifier of the timing. e.g. STD (stands for Schedule Time Departure)
          type: string
          example: STD
        value:
          type: string
          format: date-time
          example: 06:00:00
        delays:
          description: delays that might be recorded on a timing
          type: array
          items:
            $ref: '#/components/schemas/Delay'
    Delay:
      properties:
        duration:
          description: the delay recorded for the timing following [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Durations)
          type: string
          example: PT25M
    Departure:
      properties:
        terminal:
          description: the departure terminal of the airport
          $ref: '#/components/schemas/Terminal'
        gate:
          description: the departure gate of the airport
          $ref: '#/components/schemas/Gate'
        timings:
          description: the list of timings
          type: array
          items:
            $ref: '#/components/schemas/Timing'
    Partnership:
      properties:
        operatingFlight:
          $ref: '#/components/schemas/FlightDesignator'
    DatedFlight:
      properties:
        type:
          description: the resource name
          type: string
          readOnly: true
          example: string-value
        scheduledDepartureDate:
          description: the scheduled departure date
          type: string
          format: date
          example: '2018-11-06'
        flightDesignator:
          description: the flight designator element
          $ref: '#/components/schemas/FlightDesignator'
          example:
            carrierCode: QF
            flightNumber: 1
            operationalSuffix: _
        flightPoints:
          description: 'the flight points of the flight.

            At least one departure, one arrival

            '
          type: array
          items:
            $ref: '#/components/schemas/FlightPoint'
        segments:
          description: 'the list of segments of the datedFlight

            - definition of segment: the commercial unit corresponding to the passenger journey traveling between two points with the same flight (same flight designator)

            '
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        legs:
          description: 'the list of legs of the datedFlight.

            - definition of leg: operation of the aircraft between a departure station and the next arrival station (between take off and landing)

            '
          type: array
          items:
            $ref: '#/components/schemas/Leg'
    Collection_Meta:
      type: object
      title: Collection_Meta
      properties:
        count:
          type: integer
          example: 1
        links:
          type: object
          title: CollectionLinks
          properties:
            self:
              type: string
              format: uri
              example: https://test.api.amadeus.com/v1/area/resources?...
            next:
              type: string
              format: uri
              example: https://test.api.amadeus.com/v1/area/resources?...
            previous:
              type: string
              format: uri
              example: https://test.api.amadeus.com/v1/area/resources?...
            last:
              type: string
              format: uri
              example: https://test.api.amadeus.com/v1/area/resources?...
            first:
              type: string
              format: uri
              example: https://test.api.amadeus.com/v1/area/resources?...
            up:
              type: string
              format: uri
              example: https://test.api.amadeus.com/v1/area/resources?...
          example:
            self: https://test.api.amadeus.com/v1/area/resources?param=value
    Segment:
      properties:
        boardPointIataCode:
          description: 3-letter IATA code of the departure airport. e.g. CDG
          pattern: '[a-zA-Z]{3}'
          type: string
          example: LHR
        offPointIataCode:
          description: 3-letter IATA code of the arrival airport. e.g. AMS
          pattern: '[a-zA-Z]{3}'
          type: string
          example: BKK
        scheduledSegmentDuration:
          type: string
          description: duration of the segment following standard [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Durations)
          example: PT14H50M
        partnership:
          $ref: '#/components/schemas/Partnership'
    Issue:
      type: object
      properties:
        status:
          description: the HTTP status code applicable to this error
          type: integer
          example: 1
        code:
          description: an application-specific error code
          type: integer
          format: int64
          example: 1
        title:
          description: a short summary of the error
          type: string
          example: string-value
        detail:
          description: explanation of the error
          type: string
          example: string-value
        source:
          type: object
          title: Issue_Source
          description: an object containing references to the source of the error
          maxProperties: 1
          properties:
            pointer:
              description: a JSON Pointer [RFC6901] to the associated entity in the request document
              type: string
              example: string-value
            parameter:
              description: a string indicating which URI query parameter caused the issue
              type: string
              example: string-value
            example:
              description: a string indicating an example of the right value
              type: string
              example: string-value
    Error_401:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
      required:
      - errors
      example:
        errors:
        - status: 401
          code: 20
          title: RESTRICTED
          detail: Query unauthorized
    Terminal:
      properties:
        code:
          description: the code of the terminal
          type: string
          example: 1
    Arrival:
      properties:
        terminal:
          description: the arrival terminal of the airport
          $ref: '#/components/schemas/Terminal'
        gate:
          description: the arrival gate of the airport
          $ref: '#/components/schemas/Gate'
        timings:
          description: the list of timings
          type: array
          items:
            $ref: '#/components/schemas/Timing'
    Error_400:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
      required:
      - errors
      example:
        errors:
        - status: 400
          code: 477
          title: INVALID FORMAT
          detail: invalid query parameter format
          source:
            parameter: airport
            example: CDG
    FlightPoint:
      properties:
        iataCode:
          description: 3-letter IATA code of the airport. e.g. CDG
          type: string
          example: CDG
        departure:
          description: the departure information if the flightPoint is a departure for the flight
          $ref: '#/components/schemas/Departure'
        arrival:
          description: the arrival information if the flightPoint is an arrival for the flight
          $ref: '#/components/schemas/Arrival'
    Gate:
      properties:
        mainGate:
          description: the main gate number
          type: string
          example: 10A
    Leg:
      properties:
        boardPointIataCode:
          description: 3-letter IATA code of the departure airport. e.g. LHR
          pattern: '[a-zA-Z]{3}'
          type: string
          example: LHR
        offPointIataCode:
          description: 3-letter IATA code of the arrival airport. e.g. BKK
          pattern: '[a-zA-Z]{3}'
          type: string
          example: BKK
        aircraftEquipment:
          $ref: '#/components/schemas/AircraftEquipment'
        scheduledLegDuration:
          type: string
          description: duration of the leg following standard [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Durations)
          example: PT14H50M
    FlightDesignator:
      properties:
        carrierCode:
          description: 2 to 3-character IATA code of the carrier. e.g. 6X
          type: string
          example: AF
        flightNumber:
          description: 1 to 4-digit number of the flight e.g. 4537
          type: integer
          format: int64
          example: 1
        operationalSuffix:
          description: 1-letter operational suffix of the flight e.g. A
          type: string
          example: string-value
    Error_500:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
      required:
      - errors
      example:
        errors:
        - status: 500
          code: 141
          title: SYSTEM ERROR HAS OCCURRED
    AircraftEquipment:
      properties:
        aircraftType:
          description: the type of aircraft that will operate the leg
          type: string
          example: 733
  responses:
    datedFlights:
      description: A list of dated flights
      content:
        application/vnd.amadeus+json:
          schema:
            title: Success Flights.
            required:
            - data
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/DatedFlight'
              meta:
                $ref: '#/components/schemas/Collection_Meta'
              warnings:
                type: array
                items:
                  $ref: '#/components/schemas/Issue'
            example:
              meta:
                count: 1
                links:
                  self: https://test.api.amadeus.com/v2/schedule/flights?carrierCode=TP&flightNumber=487&scheduledDepartureDate=2023-08-01
              data:
              - type: DatedFlight
                scheduledDepartureDate: '2023-08-01'
                flightDesignator:
                  carrierCode: TP
                  flightNumber: 487
                flightPoints:
                - iataCode: NCE
                  departure:
                    timings:
                    - qualifier: STD
                      value: 2023-08-01T18:10+02:00
                - iataCode: LIS
                  arrival:
                    timings:
                    - qualifier: STA
                      value: 2023-08-01T19:45+01:00
                segments:
                - boardPointIataCode: NCE
                  offPointIataCode: LIS
                  scheduledSegmentDuration: PT2H35M
                  partnership:
                    operatingFlight:
                      carrierCode: A3
                      flightNumber: 1748
                legs:
                - boardPointIataCode: NCE
                  offPointIataCode: LIS
                  aircraftEquipment:
                    aircraftType: E90
                  scheduledLegDuration: PT2H35M
    '500':
      description: Unexpected Error
      content:
        application/vnd.amadeus+json:
          schema:
            $ref: '#/components/schemas/Error_500'
    '400':
      description: 'code    | title

        ------- | -------------------------------------

        477     | INVALID FORMAT

        572     | INVALID OPTION

        2781    | INVALID LENGTH

        4926    | INVALID DATA RECEIVED

        32171   | MANDATORY DATA MISSING

        '
      content:
        application/vnd.amadeus+json:
          schema:
            $ref: '#/components/schemas/Error_400'
    '401':
      description: Unauthorized
      content:
        application/vnd.amadeus+json:
          schema:
            $ref: '#/components/schemas/Error_401'
x-generatedAt: '2020-09-07T09:52:13.997Z'
