    Error_400_2:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Issue_2'
      required:
      - errors
      example:
        errors:
        - status: 400
          code: 477
          title: INVALID FORMAT
          detail: invalid query parameter format
          source:
            parameter: airport
            example: CDG
    ElementaryPrice:
      description: elementaryPrice
      type: object
      properties:
        amount:
          type: string
          description: Amount of the fare. could be alpha numeric. Ex- 500.20 or 514.13A, 'A'signifies additional collection.
          example: '199.50'
        currencyCode:
          type: string
          description: Currency type of the fare.
          example: EUR
    Error_500_2:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Issue_2'
      required:
      - errors
      example:
        errors:
        - status: 500
          code: 141
          title: SYSTEM ERROR HAS OCCURRED
    Activity:
      type: object
      title: Activity
      description: Activity description
      properties:
        type:
          type: string
          description: the ressource name
          readOnly: true
          example: string-value
        id:
