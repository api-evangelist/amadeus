openapi: 3.2.0
info:
  version: 1.0.4
  title: Airport On-Time Performance Airport Ontime Prediction API
  x-tags:
  - '#ama-for-dev'
  x-status: validated
  x-release-note:
    '1.0':
    - Initial Version
  description: Before using this API, we recommend you read our **Authorization Guide** for more information on how to generate an access token.
servers:
- url: https://test.api.amadeus.com/v1
tags:
- name: airport-ontime-prediction
paths:
  /airport/predictions/on-time:
    get:
      tags:
      - airport-ontime-prediction
      operationId: getAirportOnTimePrediction
      summary: Amadeus Returns a Percentage of On-time Flight Departures from a Given Airport
      parameters:
      - name: airportCode
        in: query
        description: airport [IATA code](http://www.iata.org/publications/Pages/code-search.aspx), e.g. BOS for Boston
        required: true
        x-example: JFK
        schema:
          type: string
          pattern: '[A-Z]{3}'
      - name: date
        in: query
        description: the date on which the traveler will depart from the give airport. Dates are specified in the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) YYYY-MM-DD format, e.g. 2019-12-25
        required: true
        x-example: '2023-11-12'
        schema:
          type: string
          format: date
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        default:
          $ref: '#/components/responses/500'
      description: ''
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  responses:
    '500':
      description: Unexpected Error
      content:
        application/vnd.amadeus+json:
          schema:
            $ref: '#/components/schemas/Error_500'
    '400':
      description: "code    | title                                 \n------- | ------------------------------------- \n477     | INVALID FORMAT\n572     | INVALID OPTION\n4926    | INVALID DATA RECEIVED               \n32171   | MANDATORY DATA MISSING \t     \n"
      content:
        application/vnd.amadeus+json:
          schema:
            $ref: '#/components/schemas/Error_400'
    '200':
      description: Success
      content:
        application/vnd.amadeus+json:
          schema:
            $ref: '#/components/schemas/Prediction'
  schemas:
    Issue:
      properties:
        status:
          description: the HTTP status code applicable to this error
          type: integer
          example: 1
        code:
          description: an application-specific error code
          type: integer
          format: int64
          example: 1
        title:
          description: a short summary of the error
          type: string
          example: string-value
        detail:
          description: explanation of the error
          type: string
          example: string-value
        source:
          type: object
          title: Issue_Source
          description: an object containing references to the source of the error
          maxProperties: 1
          properties:
            pointer:
              description: a JSON Pointer [RFC6901] to the associated entity in the request document
              type: string
              example: string-value
            parameter:
              description: a string indicating which URI query parameter caused the issue
              type: string
              example: string-value
            example:
              description: a string indicating an example of the right value
              type: string
              example: string-value
    OnTimePrediction:
      properties:
        type:
          description: the resource name (`prediction`)
          type: string
          example: string-value
        subType:
          type: string
          example: trip-purpose
        id:
          description: item identifier
          type: string
          readOnly: true
          example: '12345'
        result:
          $ref: '#/components/schemas/PredictionResultType'
        probability:
          description: probability of the forecast (between 0 and 1)
          type: string
          example: string-value
    Error_500:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
      required:
      - errors
      example:
        errors:
        - status: 500
          code: 141
          title: SYSTEM ERROR HAS OCCURRED
    Meta:
      type: object
      properties:
        links:
          $ref: '#/components/schemas/Links'
    Error_400:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
      required:
      - errors
      example:
        errors:
        - status: 400
          code: 477
          title: INVALID FORMAT
          detail: invalid query parameter format
          source:
            parameter: airport
            example: CDG
    Prediction:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/OnTimePrediction'
        meta:
          $ref: '#/components/schemas/Meta'
      example:
        data:
          id: JFK20231112
          probability: '0.928'
          result: '0.84062016'
          subType: on-time
          type: prediction
        meta:
          links:
            self: https://test.api.amadeus.com/v1/airport/predictions/on-time?airportCode=JFK&date=2023-11-12
    PredictionResultType:
      description: forecast description
      type: string
      example: 0.8
    Links:
      properties:
        self:
          type: string
          format: uri
          example: https://example.com/resource
        related:
          type: string
          format: uri
          example: https://example.com/resource
        type:
          type: string
          example: string-value
