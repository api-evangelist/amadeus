openapi: 3.2.0
info:
  title: Amadeus Search API
  x-refined-note:
  - x-release-note differs across the merged source definitions and was not carried
  - x-status differs across the merged source definitions and was not carried
  - x-tags differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Search across 4 of this provider''s published API definitions: amadeus-hotel-name-autocomplete-openapi.yml, amadeus-points-of-interest-openapi.yml, amadeus-safe-place-openapi.yml, amadeus-tours-and-activities-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://test.api.amadeus.com/v1
tags:
- name: Search
paths:
  /reference-data/locations/hotel:
    get:
      tags:
      - Search
      summary: Amadeus Returns a List of Hotels Matching a Given Keyword
      operationId: gethotels
      description: ''
      parameters:
      - name: keyword
        in: query
        description: Location query keyword
        required: true
        x-example: PARI
        schema:
          type: string
          maxLength: 40
          minLength: 4
          pattern: ^[A-Za-z0-9 *'-]{4,40}$
      - name: subType
        in: query
        description: "Category of search - To enter several values, repeat the query parameter \nUse HOTEL_LEISURE to target aggregators or HOTEL_GDS to target directly the chains"
        required: true
        x-example: []
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - HOTEL_LEISURE
            - HOTEL_GDS
      - name: countryCode
        in: query
        description: The country in which you search the subType. Country Code in [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) format
        x-example: FR
        schema:
          type: string
          maxLength: 2
          minLength: 2
          pattern: '[A-Za-z]{2}$'
      - name: lang
        in: query
        description: "The language in which you want the results in following [ISO 639-1](https://fr.wikipedia.org/wiki/Liste_des_codes_ISO_639-1). \n\nIf the language entered is not available then the results will be shown in the default language, English."
        required: false
        x-example: EN
        schema:
          type: string
          default: EN
          maxLength: 2
          minLength: 2
          pattern: '[A-Za-z]{2}$'
      - name: max
        in: query
        description: The number of results requested from 1 to 20
        required: false
        x-example: 1
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: Successful Search Operation
          content:
            application/vnd.amadeus+json:
              schema:
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          description: ID of the resource.
                          minimum: 1
                          maximum: 10
                        type:
                          type: string
                          description: Type of resource or the resource name.
                        name:
                          type: string
                          description: Name of the location (Hotel Name)
                          minLength: 1
                          maxLength: 80
                          pattern: ^[A-Za-z0-9 - * '.]+
                        iataCode:
                          type: string
                          description: '[IATA codes](http://www.iata.org/publications/Pages/code-search.aspx) associated with the location.'
                          minLength: 3
                          maxLength: 3
                          pattern: ^[A-Z]+
                        hotelIds:
                          type: array
                          description: 'HotelIDs associated with the location only if it''s a hotel. For leisure property dupes ID are listed as well. '
                          uniqueItems: true
                          maxItems: 10
                          minItems: 1
                          items:
                            type: string
                        subType:
                          type: string
                          description: The category of the location or Point of reference (HOTEL_LEISURE,HOTEL_GDS).
                          enum:
                          - HOTEL_GDS
                          - HOTEL_LEISURE
                        address:
                          type: object
                          description: Address of the location containing Cityname, Statecode and countrycode respectively.
                          properties:
                            cityName:
                              type: string
                              description: The name of the city to which the location belongs to.
                              minLength: 1
                              maxLength: 105
                              pattern: ^[A-Za-z0-9 - ]+
                            stateCode:
                              type: string
                              description: The statecode to which the location belongs to.
                              minLength: 2
                              maxLength: 2
                              pattern: ^[A-Z]+
                            countryCode:
                              type: string
                              description: The countrycode to which the location belongs to.
                              minLength: 2
                              maxLength: 2
                              pattern: ^[A-Z]+
                          required:
                          - cityName
                          - countryCode
                        geoCode:
                          type: object
                          description: Geocode of the location containing latitude and longitude respectively.
                          properties:
                            latitude:
                              type: number
                              format: double
                              description: Latitude of the location on Earth.
                            longitude:
                              type: number
                              format: double
                              description: Longitude of the location on Earth.
                          required:
                          - latitude
                          - longitude
                        relevance:
                          type: integer
                          description: A no. between 1-100. The higher the number better is the relevant search for that location.
                      required:
                      - id
                      - type
                      - name
                      - iataCode
                      - hotelIds
                      - subType
                title: Success
